name: Release

# 推送 v* tag 时发布；手动触发只做「构建 + 可选签名」演练，不创建 Release。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Package
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show toolchain
        run: swift --version

      # ---------- 签名模式 ----------
      # 1) 配了签名证书 + 公证凭据 → Developer ID（需付费订阅）
      # 2) 只配了签名证书           → 自签名（免费，签名稳定但 Gatekeeper 仍会拦）
      # 3) 什么都没配               → ad-hoc（免费，零配置）
      - name: Detect signing mode
        id: mode
        env:
          CERT: ${{ secrets.SIGN_CERT_P12_BASE64 }}
          NOTARY: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${CERT:-}" ] && [ -n "${NOTARY:-}" ]; then
            echo "mode=developer-id" >> "$GITHUB_OUTPUT"
          elif [ -n "${CERT:-}" ]; then
            echo "mode=self-signed" >> "$GITHUB_OUTPUT"
          else
            echo "mode=adhoc" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        run: swift test

      # 先跑自检（凭据泄露 / 产物隐私 / 架构约束），此时还是 ad-hoc 构建
      - name: Pre-release checks
        run: ./scripts/release-check.sh

      # ---------- 导入证书 ----------
      - name: Import signing certificate
        if: steps.mode.outputs.mode != 'adhoc'
        env:
          CERT: ${{ secrets.SIGN_CERT_P12_BASE64 }}
          CERT_PW: ${{ secrets.SIGN_CERT_PASSWORD }}
          KEYCHAIN_PW: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          printf '%s' "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PW" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "证书已导入临时钥匙串"

      # ---------- 签名 ----------
      - name: Sign
        if: steps.mode.outputs.mode != 'adhoc'
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          KEYCHAIN_PW: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          # 每个 step 是新进程：重新解锁并加入搜索列表，否则 codesign 找不到身份
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security show-keychain-info "$KEYCHAIN" || true

          # 自签名证书通常未受信任，find-identity -v 不会列出它，
          # 因此不加 -v 并改用 SHA-1 哈希签名（build.sh 支持）。
          if [ "$MODE" = "developer-id" ]; then
            IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN" || true)"
          else
            IDENTITIES="$(security find-identity "$KEYCHAIN" || true)"
          fi

          IDENTITY=""
          while IFS= read -r line; do
            if [[ "$line" =~ ^[[:space:]]*[0-9]+\)[[:space:]]+([0-9A-Fa-f]{40})[[:space:]]\"(.*)\" ]]; then
              if [ "$MODE" = "developer-id" ]; then
                IDENTITY="${BASH_REMATCH[2]}"
              else
                IDENTITY="${BASH_REMATCH[1]}"
              fi
              break
            fi
          done <<< "$IDENTITIES"

          if [ -z "$IDENTITY" ]; then
            echo "::error::钥匙串里没有可用的签名身份（mode=${MODE}）"
            security find-identity "$KEYCHAIN" || true
            exit 1
          fi
          echo "找到签名身份（模式 ${MODE}）"

          if [ "$MODE" = "developer-id" ]; then
            SIGN_IDENTITY="$IDENTITY" SIGN_KEYCHAIN="$KEYCHAIN" SIGN_HARDENED=1 ./build.sh --no-install
          else
            SIGN_IDENTITY="$IDENTITY" SIGN_KEYCHAIN="$KEYCHAIN" ./build.sh --no-install
          fi

      # ---------- 公证（仅 Developer ID）----------
      - name: Notarize and staple
        if: steps.mode.outputs.mode == 'developer-id'
        env:
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PW: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ditto -c -k --keepParent AutoSwitchInput.app dist/notarize.zip
          xcrun notarytool submit dist/notarize.zip \
            --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$NOTARY_PW" \
            --wait --output-format json > dist/notarization.json
          python3 -c 'import json,sys; s=json.load(open("dist/notarization.json"))["status"]; print("notarization:", s); sys.exit(0 if s=="Accepted" else 1)'
          xcrun stapler staple AutoSwitchInput.app
          xcrun stapler validate AutoSwitchInput.app
          spctl -a -vv AutoSwitchInput.app
          rm -f dist/notarize.zip

      # ---------- 打包 ----------
      - name: Package
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' AutoSwitchInput.app/Contents/Info.plist)"
          fi
          mkdir -p dist
          ditto -c -k --keepParent AutoSwitchInput.app "dist/AutoSwitchInput-$VERSION.zip"
          hdiutil create -volname "AutoSwitchInput" -srcfolder AutoSwitchInput.app \
            -ov -format UDZO "dist/AutoSwitchInput-$VERSION.dmg"
          ( cd dist && shasum -a 256 ./*.zip ./*.dmg > SHA256SUMS.txt )

          # 安装说明放在仓库里，避免 YAML 里嵌 heredoc 的缩进坑
          if [ "$MODE" = "developer-id" ]; then
            cp docs/RELEASE_NOTES.md dist/RELEASE_NOTES.md
          else
            cp docs/RELEASE_NOTES_UNSIGNED.md dist/RELEASE_NOTES.md
          fi
          ls -lh dist

      # ---------- 发布 ----------
      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            dist/*.zip dist/*.dmg dist/SHA256SUMS.txt \
            --title "$GITHUB_REF_NAME" \
            --notes-file dist/RELEASE_NOTES.md

      - name: Upload dry-run artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: AutoSwitchInput-${{ steps.mode.outputs.mode }}
          path: dist/*
          retention-days: 7

      - name: Cleanup keychain
        if: always() && steps.mode.outputs.mode != 'adhoc'
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          rm -f "$RUNNER_TEMP/cert.p12"
