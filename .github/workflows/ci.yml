name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      # 构建、测试、打包与全部架构 / 凭据断言都收在同一个脚本里，
      # 避免 CI 与发布前自检各维护一份、逐渐漂移。
      - name: Pre-release checks
        run: ./scripts/release-check.sh
