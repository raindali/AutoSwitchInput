name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          # 凭据历史扫描需要完整历史，浅克隆只看得到最后一个提交
          fetch-depth: 0

      - name: Show toolchain
        run: swift --version

      - name: Pre-release checks
        run: ./scripts/release-check.sh
